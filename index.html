<!DOCTYPE html>
<html lang="en" dir="ltr" data-root="./">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beauty Finder — Discover Your Beauty, Find Your Match</title>
  <meta name="description" content="Beauty Finder: compare cosmetics, explore ingredients and discover products by preference.">
  <script>(function(){var l;try{l=localStorage.getItem('bf-lang')}catch(e){}if(!l){var n=(navigator.language||'en').toLowerCase();l=n.indexOf('ar')===0?'ar':n.indexOf('ckb')===0?'ckb':(n.indexOf('ku')===0||n.indexOf('kmr')===0)?'kmr':'en'}var d=document.documentElement;d.lang=l;d.dir=(l==='ar'||l==='ckb')?'rtl':'ltr'})();</script>
  <link rel="icon" href="./images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Poppins:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css?v=4">
</head>
<body data-page="home">
  <header id="site-header" class="site-header"></header>
  <main>
    <section class="hero"><div class="container hero-grid">
      <div class="hero-copy">
        <p class="kicker" data-i18n="hero.kicker"></p>
        <h1 data-i18n="hero.title"></h1>
        <p class="lead" data-i18n="hero.sub"></p>
        <form id="hero-search" class="search-pill" role="search" novalidate>
          <span data-icon="search"></span>
          <input name="q" type="search" data-i18n-ph="hero.search" aria-label="Search">
          <button class="btn" type="submit" data-i18n="search.btn"></button>
        </form>
        <div class="hero-cta">
          <a class="btn btn-dark" data-page="products"><span data-i18n="hero.cta1"></span></a>
          <a class="btn btn-outline" data-page="quiz"><span data-icon="sparkles"></span><span data-i18n="hero.cta2"></span></a>
        </div>
      </div>
      <div class="hero-visual">
        <img src="images/hero-beauty.jpg" alt="" width="1248" height="832">
        <span class="hero-badge b1"><span data-icon="scale"></span><span data-i18n="hero.badge1"></span></span>
        <span class="hero-badge b2"><span data-icon="flask"></span><span data-i18n="hero.badge2"></span></span>
        <div id="hero-float"></div>
      </div>
    </div></section>

    <div class="marquee" aria-hidden="true"><div class="marquee-track"><span data-i18n="marquee"></span><span>✿</span><span data-i18n="marquee"></span><span>✿</span><span data-i18n="marquee"></span><span>✿</span><span data-i18n="marquee"></span><span>✿</span><span data-i18n="marquee"></span><span>✿</span><span data-i18n="marquee"></span><span>✿</span><span data-i18n="marquee"></span><span>✿</span><span data-i18n="marquee"></span><span>✿</span><span data-i18n="marquee"></span><span>✿</span><span data-i18n="marquee"></span><span>✿</span></div></div>

    <section><div class="container stats" id="stats"></div></section>

    <section class="section"><div class="container">
      <div class="section-head"><div>
        <h2 class="section-title" data-i18n="home.cats"></h2>
        <p class="section-sub" data-i18n="home.catsSub"></p>
      </div></div>
      <div class="cats" id="cats"></div>
    </div></section>

    <section class="section tint"><div class="container">
      <div class="section-head"><div>
        <h2 class="section-title" data-i18n="home.trending"></h2>
        <p class="section-sub" data-i18n="home.trendingSub"></p>
      </div><a class="text-link" data-page="products"><span data-i18n="home.viewAll"></span><span data-icon="arrow" class="flip-rtl"></span></a></div>
      <div class="grid" id="trending"></div>
    </div></section>

    <section class="section"><div class="container">
      <div class="section-head"><div>
        <h2 class="section-title" data-i18n="home.why"></h2>
        <p class="section-sub" data-i18n="home.whySub"></p>
      </div></div>
      <div class="features">
        <a class="feature reveal" data-page="ingredients"><span class="feature-icon" data-icon="flask"></span>
          <h3 data-i18n="f.ing.title"></h3><p data-i18n="f.ing.text"></p>
          <span class="text-link"><span data-i18n="f.open"></span><span data-icon="arrow" class="flip-rtl"></span></span></a>
        <a class="feature reveal" data-page="compare"><span class="feature-icon" data-icon="scale"></span>
          <h3 data-i18n="f.cmp.title"></h3><p data-i18n="f.cmp.text"></p>
          <span class="text-link"><span data-i18n="f.open"></span><span data-icon="arrow" class="flip-rtl"></span></span></a>
        <a class="feature reveal" data-page="quiz"><span class="feature-icon" data-icon="sparkles"></span>
          <h3 data-i18n="f.quiz.title"></h3><p data-i18n="f.quiz.text"></p>
          <span class="text-link"><span data-i18n="f.open"></span><span data-icon="arrow" class="flip-rtl"></span></span></a>
      </div>
    </div></section>

    <section class="section"><div class="container spotlight">
      <img class="reveal" src="images/ingredients.jpg" alt="" loading="lazy" width="1200" height="800">
      <div class="reveal">
        <h2 class="section-title" data-i18n="home.ingTitle"></h2>
        <p data-i18n="home.ingText"></p>
        <a class="btn" data-page="ingredients"><span data-icon="flask"></span><span data-i18n="home.ingBtn"></span></a>
      </div>
    </div></section>

    <section class="section tint"><div class="container">
      <div class="section-head"><div>
        <h2 class="section-title" data-i18n="home.brands"></h2>
        <p class="section-sub" data-i18n="home.brandsSub"></p>
      </div></div>
      <div class="brands" id="brands"></div>
    </div></section>

    <section class="section"><div class="container">
      <div class="cta-band reveal">
        <div><h2 data-i18n="cta.title"></h2><p data-i18n="cta.text"></p></div>
        <a class="btn" data-page="quiz"><span data-icon="sparkles"></span><span data-i18n="hero.cta2"></span></a>
      </div>
    </div></section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="./js/i18n.js?v=4"></script>
  <script src="./js/main.js?v=4"></script>
  <script src="./js/home.js?v=4"></script>
</body>
</html>

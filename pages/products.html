<!DOCTYPE html>
<html lang="en" dir="ltr" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore products · Beauty Finder</title>
  <meta name="description" content="Beauty Finder: compare cosmetics, explore ingredients and discover products by preference.">
  <script>(function(){var l;try{l=localStorage.getItem('bf-lang')}catch(e){}if(!l){var n=(navigator.language||'en').toLowerCase();l=n.indexOf('ar')===0?'ar':n.indexOf('ckb')===0?'ckb':(n.indexOf('ku')===0||n.indexOf('kmr')===0)?'kmr':'en'}var d=document.documentElement;d.lang=l;d.dir=(l==='ar'||l==='ckb')?'rtl':'ltr'})();</script>
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Poppins:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=4">
</head>
<body data-page="products">
  <header id="site-header" class="site-header"></header>
  <main>
    <section class="page-head"><div class="container">
      <h1 data-i18n="p.title"></h1>
      <p data-i18n="p.sub"></p>
    </div></section>
    <section class="section"><div class="container shop">
      <aside id="filters" class="filters panel">
        <h2 data-i18n="p.filters"></h2>
        <div class="filter-group"><label for="f-q" data-i18n="p.search"></label>
          <input id="f-q" type="search" autocomplete="off"></div>
        <div class="filter-group"><span data-i18n="p.category"></span><div class="chips" id="f-cats"></div></div>
        <div class="filter-group"><label for="f-type" data-i18n="p.type"></label><select id="f-type"></select></div>
        <div class="filter-group"><label for="f-brand" data-i18n="p.brand"></label><select id="f-brand"></select></div>
        <div class="filter-group"><span data-i18n="p.price"></span>
          <div class="price-range">
            <input id="f-min" type="number" min="0" inputmode="numeric" data-i18n-ph="p.min" aria-label="Min">
            <input id="f-max" type="number" min="0" inputmode="numeric" data-i18n-ph="p.max" aria-label="Max">
          </div></div>
        <div class="filter-group"><span data-i18n="p.pref"></span><div class="chips" id="f-tags"></div></div>
        <button class="btn btn-outline btn-sm" id="f-reset" type="button" data-i18n="p.reset"></button>
      </aside>
      <div>
        <div class="shop-bar">
          <button class="btn btn-soft btn-sm" id="filter-toggle" type="button" aria-expanded="false" aria-controls="filters" data-i18n="p.filters"></button>
          <span id="count"></span>
          <label><span data-i18n="p.sort"></span><select id="f-sort"></select></label>
        </div>
        <div class="grid" id="grid"></div>
        <div class="center"><button class="btn btn-outline" id="more" type="button" hidden data-i18n="p.more"></button></div>
      </div>
    </div></section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="../js/i18n.js?v=4"></script>
  <script src="../js/main.js?v=4"></script>
  <script src="../js/catalog.js?v=4"></script>
</body>
</html>

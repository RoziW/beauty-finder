<!DOCTYPE html>
<html lang="en" dir="ltr" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · Beauty Finder</title>
  <meta name="description" content="Beauty Finder: compare cosmetics, explore ingredients and discover products by preference.">
  <script>(function(){var l;try{l=localStorage.getItem('bf-lang')}catch(e){}if(!l){var n=(navigator.language||'en').toLowerCase();l=n.indexOf('ar')===0?'ar':n.indexOf('ckb')===0?'ckb':(n.indexOf('ku')===0||n.indexOf('kmr')===0)?'kmr':'en'}var d=document.documentElement;d.lang=l;d.dir=(l==='ar'||l==='ckb')?'rtl':'ltr'})();</script>
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Poppins:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=4">
</head>
<body data-page="contact">
  <header id="site-header" class="site-header"></header>
  <main>
    <section class="page-head"><div class="container">
      <h1 data-i18n="ct.title"></h1>
      <p data-i18n="ct.sub"></p>
    </div></section>
    <section class="section"><div class="container contact-wrap">
      <form id="contact-form" class="panel form-stack" novalidate>
        <label><span data-i18n="ct.name"></span><input name="name" type="text" maxlength="80" autocomplete="name"></label>
        <label><span data-i18n="ct.email"></span><input name="email" type="email" maxlength="120" autocomplete="email" dir="ltr"></label>
        <label><span data-i18n="ct.message"></span><textarea name="message" rows="5" maxlength="2000"></textarea></label>
        <p class="form-error" id="contact-error" role="alert" hidden></p>
        <button class="btn" type="submit"><span data-icon="mail"></span><span data-i18n="ct.send"></span></button>
      </form>
      <div id="contact-done" class="panel done" hidden>
        <span data-icon="check"></span>
        <h2 data-i18n="ct.thanks"></h2>
        <p class="muted" data-i18n="ct.thanksText"></p>
        <button class="btn btn-outline" id="contact-again" type="button" data-i18n="ct.another"></button>
      </div>
    </div></section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="../js/i18n.js?v=4"></script>
  <script src="../js/main.js?v=4"></script>
  <script src="../js/contact.js?v=4"></script>
</body>
</html>
